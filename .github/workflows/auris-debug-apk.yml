name: Auris Debug APK

# A sideloadable debug build of the dev flavour (com.dev.bitchord, "BitChord Next"),
# which installs next to the real Auris instead of over it. Debug-signed, so it
# needs no secrets. Runs on pushes to the volume-automix branch of this fork.
on:
  push:
    branches: [volume-automix]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auris-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # A package of its own, so this installs next to the Auris already on the
      # phone instead of failing against its signature and version code (or,
      # worse, replacing it and its library).
      - name: Use a separate package name
        run: |
          sed -i 's/applicationId = "com.dev.bitchord"/applicationId = "com.dev.bitchord.next"/' app/build.gradle.kts
          sed -i 's/"app_name", "BitChord Next"/"app_name", "Auris Next"/' app/build.gradle.kts
          grep -n 'com.dev.bitchord.next\|Auris Next' app/build.gradle.kts
      # One fixed debug key for every build, so a new APK installs over the
      # previous one instead of being rejected for a signature mismatch.
      - name: Use the fixed debug keystore
        run: |
          mkdir -p ~/.android
          base64 -d .github/auris-debug.keystore.b64 > ~/.android/debug.keystore
      - name: Build dev debug APK
        run: ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auris-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Publish the APK to a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/dev/debug/*.apk | head -1)
          cp "$apk" auris-dev-debug.apk
          gh release delete auris-volume-automix --yes --cleanup-tag || true
          gh release create auris-volume-automix auris-dev-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Auris dev debug build (volume-automix)" \
            --notes "Debug-signed dev flavour with the output level slider and the Automix cover-art handoff."
